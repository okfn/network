name: 'Micelio, plataforma para la investigación UCA'
description: "Micelio is the platform developed by UCA for scientific research. Its name\r\nserves as a metaphor for the mycelial networks through which various biological organisms within an ecosystem\r\ninteract and communicate with one another. Under this concept, UCA seeks to foster collaborative work\r\namong researchers and research networks, with the aim of sharing the University’s scientific output\r\nwith the academic world and highlighting the importance of knowledge exchange within a single network: Micelio."
