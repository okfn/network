description: "# Glossary of Fields\r\n\r\nGoogle Issue Tracker provides a set of default fields that are available in all\r\n[issues](https://developers.google.com/issue-tracker/concepts/issues). Additional\r\n[custom fields](https://developers.google.com/issue-tracker/concepts/custom-fields) may be available on a per-component\r\nbasis.\r\n\r\nThe following table shows the default fields provided by Issue Tracker:\r\n\r\n| Field | Description |\r\n|---|---|\r\n| Archived | Indicates whether the issue has been archived. |\r\n| Assignee | User to which this issue is assigned. |\r\n| Blocked By | IDs of issues that [block this issue](https://developers.google.com/issue-tracker/guides/block-issue). |\r\n| Blocking | IDs of issues that [this issue blocks](https://developers.google.com/issue-tracker/guides/block-issue). |\r\n| CC | List of users or groups who are interested in the issue, but are not assignees, reporters or verifiers. |\r\n| Collaborators | List of users that are actively working on an issue. |\r\n| Component | [Component](https://developers.google.com/issue-tracker/concepts/components) that contains the issue. |\r\n| Created | Date and time at which the issue was created. |\r\n| Description | A detailed description of the issue including steps to reproduce it (if applicable). This field might already be partially populated for you if description text is provided by the default or the selected template. You can also check the **Markdown** option to write the description as [Markdown](https://commonmark.org) text. |\r\n| Status Update | The \"current state\" of an issue. On high traffic issues, teams can use this to provide a canonical \"answer\" about what is going on. [Learn More](https://developers.google.com/issue-tracker/concepts/status-update) |\r\n| Dupe Count | Number of [duplicates](https://developers.google.com/issue-tracker/concepts/related-issues) reported for the issue. |\r\n| Duplicate Of | ID of the issue that this issue duplicates. |\r\n| Found In | Version of the software where the issue was found. |\r\n| ID | Unique numerical issue ID. |\r\n| In Prod | Indicates whether the issue occurs in production. |\r\n| Last Modified | Date and time at which the issue was last modified. |\r\n| Priority | [Priority](https://developers.google.com/issue-tracker/concepts/issues#priority) of the issue. |\r\n| Reporter | User who reported the issue. |\r\n| Severity | Severity of the issue. |\r\n| Staffing | Users or future roles (placeholders) who are planning to contribute to the issue. |\r\n| Status | [Status](https://developers.google.com/issue-tracker/concepts/issues#status) of the issue (for example, *New* , *Assigned* , or *Fixed*). |\r\n| Targeted To | Version of the software where the issue should be resolved. |\r\n| Type | [Type](https://developers.google.com/issue-tracker/concepts/issues#type) of issue (for example, *Bug* , *Feature Request* or *Process*). |\r\n| Verified In | Version of the software where the issue was verified as resolved. |\r\n| Verifier | User who verified the resolution of the issue. |\r\n| Resolved | Date and time at which the issue was resolved. |\r\n| Verified | Date and time at which the issue was verified. |\r\n| Vote count | Number of times users have voted for the issue (e.g. by starring it). |\r\n| Estimated Effort | Estimated Effort in story points, dev days, or t-shirt sizes (configured by component administrators) |\r\n| Start Date | Planned start date. |\r\n| End Date | Planned end date. |\r\n| Risk | Risk to meeting the planned *End Date*. |\r\n| Commitment Level | Planned level of work completion. |"
