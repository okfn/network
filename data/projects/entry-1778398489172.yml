name: OpenMercantil
description: >-
  OpenMercantil is an independent public-data project that makes Spanish
  mercantile information easier to search, understand and reuse. It structures
  BORME-derived public records and other public sources into company search,
  registry-event timelines, downloads, methodology notes and a documented API.
  Its mission is to contribute to open/public data access without profit-seeking
  intent for citizens, SMEs, analysts, procurement and compliance teams,
  journalists, researchers and developers. It is not an official registry,
  certificate service, legal advice or credit-risk rating.
