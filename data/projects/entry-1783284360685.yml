name: Mapa de Transparencia del Estado Argentino
description: >-
  An independent academic civic tech initiative that monitors the Executive,
  Legislative, and Judicial branches of the Argentine government in real time.
  Powered by Explainable AI (XAI) and advanced data analytics, the platform
  cross-references official open public data to analyze procurement contracts,
  track over 1,100 public officials, and continuously calculate an Institutional
  Risk Index (IRI) to expose systemic irregularities. Built entirely on
  open-source technology, it provides an interactive visual dashboard and a
  freely available public API to democratize access to institutional
  transparency.
