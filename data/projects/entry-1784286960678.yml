name: 'OpenGLAM AI: Digital Reconstruction & Cultural Heritage Restoration'
description: >-
  An open initiative leveraging custom generative AI pipelines to restore,
  complete, and reconstruct damaged cultural heritage assets, including
  19th-century archive photography, archaeological mosaic fragments (such as the
  Zeugma mosaics), and ancient Roman architecture (such as the Library of Celsus
  at Ephesus). By reconciling historical records with AI-assisted visual
  reconstruction, the project brings vanished cultural details back into public
  view, advocating for open access to high-fidelity historical imagery.
