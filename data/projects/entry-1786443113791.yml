name: Klimachronik
description: "The Climate Chronicle is a freely accessible web application for the interactive display of historical and current weather data from official measuring stations.\r\n\r\nThe project combines publicly available data from various national weather services in a single interface. Data from Austria, Germany, Switzerland and France are currently integrated. Temperature, precipitation and other climate metrics can be viewed on a map over long periods of time, compared with each other and analyzed in detail for individual measuring stations.\r\n\r\nThe aim of the Climate Chronicle is to make extensive and often difficult-to-access weather and climate data easier to understand and use. Historical measurement series should not only be available in archives and tables, but should also be visually explored, compared regionally and used for your own analyses.\r\n\r\nThe application is based on official open data sources and is operated as an independent, privately developed project. It can be used free of charge and without a paywall. The project is continuously being expanded: step by step, more countries, data sources and climate metrics are being added."
