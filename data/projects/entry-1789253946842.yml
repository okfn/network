name: ES·pera
description: >-
  ES·pera is an independent open-data project that makes Spain’s public
  healthcare waiting lists easier to explore and compare. It brings together
  official national and regional datasets on surgery, specialist consultations
  and diagnostic tests, showing trends over time and detailed breakdowns by
  region, hospital and specialty. Each visualization preserves its source,
  period and scope, and regional data remain separate from the comparable
  national series when their methodologies differ.
