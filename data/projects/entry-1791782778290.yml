name: Discover Alone
description: >-
  Discover Alone is a free map for exploring recorded places across Ireland and
  Great Britain, including monuments, historic buildings and local landmarks. It
  brings together public heritage records and openly mapped places. Each place
  page links to its source record and credits its pictures. People can browse
  nearby places and add local stories or corrections; the map cautions that a
  recorded place may be on private land. Irish source records include the
  National Monuments Service's Archaeological Survey of Ireland and the National
  Inventory of Architectural Heritage.
