name: Vienna Building Logbook Checker (Wiener Bauwerksbuch-Pflicht-Check)
description: >-
  A free German-language web tool that turns open municipal building data into
  an address-based first check for people responsible for buildings in Vienna.
  It brings together City of Vienna open building data, the BEV cadastre and the
  Federal Monuments Office register, and displays historical city maps for
  context. Visitors can explore a building’s approximate period, monument status
  and indicative building-logbook deadline without an account. It is
  independently published by a Vienna building consultancy, not by the City of
  Vienna, and does not replace official records or advice.
