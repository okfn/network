reason: "Analista Documental en la Universidad Centroamericana \"José Simeón Cañas\" (UCA), con roles estratégicos en Open Access y Conocimiento Abierto:\r\n\r\nGestión Editorial OA: Journal Manager del Portal de Revistas UCA (OJS), implementando flujos de publicación abierta y visualizaciones interactivas para 7 revistas indexadas.\r\n\r\nDatos de Investigación Abiertos: Curador y Analista de Metadatos en Micelio (plataforma institucional UCA), gestionando el ciclo completo de datos abiertos: cosecha (OpenAlex API), preservación y reutilización.\r\n\r\nHerramientas Open Source: Desarrollo frontend para OJS, creación de visualizaciones bibliométricas replicables (D3.js, ObservableHQ, GSAP) y herramientas como Red Bibliométrica para análisis de redes de revistas OA.\r\n\r\nEspecialización técnica:\r\n\r\nOpen Journal Systems (OJS) - UNAM \r\n\r\nGestión de Datos de Investigación (PGDI) https://doi.org/10.17632/t7ntk649xv\r\n\r\nVisualización bibliométrica (OpenAlex, Kumu.io, Observable, Datawrapper, Flourish) https://observablehq.com/user/@kevin-amilcar-hernandez-gutierrez, https://app.datawrapper.de/j0EmlhW0/river/search/K.%20Gutierrez\r\n\r\nUI/UX para plataformas académicas: https://codepen.io/Kevin_Gutier09\r\n\r\nContribución al ecosistema OA: Herramientas compartidas en Figshare/CodePen, experiencia en interoperabilidad metadatos (Dublin Core), indexación internacional y preservación digital.\r\n\r\nValor para el Directorio: Experto práctico en infraestructura técnica del Open Knowledge, desde publicación OA hasta visualización y preservación de datos de investigación abierta en América Latina."
