reason: "Tatiana Marielos Aguilar de García - Especialista en infraestructura técnica del Open Access:\r\n\r\nExpertise técnica estratégica:\r\n\r\nMarcación XML: Especialista en conversión estructurada Word→JATS XML para interoperabilidad y preservación digital\r\n\r\nOJS avanzado: Implementación y optimización Sistemas de Gestión de Revistas OA\r\n\r\nCalidad editorial: Protocolos estandarizados para publicación académica internacional\r\n\r\nIndexación estratégica: Posicionamiento revistas en bases Scopus, WoS, SciELO, DOAJ\r\n\r\nContribución ecosistema OA:\r\n\r\nGarantiza sostenibilidad técnica de revistas académicas mediante XML preservable\r\n\r\nOptimiza visibilidad internacional vía indexación en bases de datos globales\r\n\r\nImplementa estándares editoriales que facilitan cosecha automática (OAI-PMH)\r\n\r\nEspecialista en calidad de metadatos para preservación a largo plazo\r\n\r\nValor para el Directorio: Experta fundamental en la cadena técnica del Open Knowledge - desde marcación estructurada hasta indexación internacional. Puente esencial entre producción editorial local y estándares globales OA, asegurando que revistas latinoamericanas sean descubribles, preservables y citables mundialmente."
