reason: >-
  Tila Cappelletto is a multilingual professional with over 20 years of
  experience working at the intersection of education, culture and technology.
  Skilled in communication, production, project & program management, and
  equity-focused community building. Her experience was acquired at
  international organizations in the USA, Spain, Portugal, and Brazil, including
  the Wikimedia Foundation; the Ministry of Education, Culture, and Sports of
  Spain; Discovery Networks; The Walt Disney Company, Banco Santander
  Foundation; and international documentary film festivals. She is  the
  co-founder and assembly chair of the feminist Portuguese-speaking wikimedia
  community Wiki Editoras Lx.
