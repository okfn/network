reason: "This person should be part of the Directory because he is an interdisciplinary creative technologist and computer engineer bridging the gap between advanced AI workflows, open data, and cultural heritage preservation. Based in Istanbul, Özgür specializes in building custom digital pipelines to reconstruct and restore historical archives, notable in projects like the 3D/AI reconstruction of the 2nd-century Library of Celsus at Ephesus, the restoration of 1870s Üsküdar photography, and the digital completion of the Zeugma mosaic fragments.\r\n\r\nWith a BSc in Computer Science and a Master of Design in Product Design, he brings over 15 years of experience in visual systems, information architecture, and teaching. His work demonstrates how open-source and proprietary visual AI models can be structured ethically and technically to respect historical integrity, making him a valuable expert resource for Open GLAM (Galleries, Libraries, Archives, and Museums) and digital humanities initiatives globally."
