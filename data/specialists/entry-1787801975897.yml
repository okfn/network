reason: "I’m applying to join the Open Knowledge Foundation Network because my work directly supports OKFN’s mission in the Indian research ecosystem.\r\nI help Indian researchers discover, adopt, and effectively use open tools for literature discovery, data management, and scholarly communication through workshops, guides, and one‑to‑one support.\r\nI also bring an active network across Indian higher education: multiple universities, university librarians and library consortia, vice‑chancellors and deans, and a large community of professors and early‑career researchers.\r\nAs an OKFN member, I will act as a local connector—promoting OKFN’s tools and campaigns in India, co‑organising events with universities and libraries, and sharing ground‑level insights from the Indian research context to strengthen OKFN’s global work."
