reason: "I would like to be part of the Open Knowledge Global Directory to connect with practitioners, organisations, and communities working to make knowledge more open, accessible, and inclusive.\r\n\r\nMy work focuses on community building, open knowledge, Wikimedia, open education, libraries, and digital skills, with a particular interest in creating opportunities for young people and women to participate meaningfully in the knowledge ecosystem.\r\n\r\nI see the directory as an opportunity to make my areas of expertise and experience discoverable, find potential collaborators, exchange knowledge and practices, and build connections across regions and disciplines. I would also be happy to contribute perspectives from my experience working with diverse communities, particularly around community-led approaches to participation, capacity building, and access to knowledge."
