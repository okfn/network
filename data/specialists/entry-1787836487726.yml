reason: "Özgür Önal is a Creative Technologist, AI Filmmaker, and the Founder of promptbricks.ai, specializing in museum and exhibition experience design, interactive installations, and evidence-based digital heritage reconstruction. Bridging Computer Science Engineering (BSc) and Product Design (MDes), he builds end-to-end generative AI and spatial media pipelines that connect historical and scientific rigor with cinematic narrative craft.\r\n\r\nHis track record spans physical-digital interactive installations (including self-built electromagnetic instruments performed at the Nissan Art Award in Yokohama), high-fidelity reconstructions of damaged cultural heritage (such as the Zeugma mosaic and the Celsus Library at Ephesus), and custom generative filmmaking architectures. Alongside his studio practice, Özgür serves as an Independent Expert Evaluator for the European Commission and EIT Culture & Creativity, assessing innovation, feasibility, and cultural impact across Horizon Europe and ERC programmes.\r\n\r\nHe brings rare, production-ready expertise in transforming open cultural data, archives, and research into immersive physical and digital experiences. He acts as a high-value technical director, exhibition experience designer, and consortium partner for Open GLAM institutions, museums, and international cultural initiatives seeking to engage contemporary audiences without flattening historical depth."
