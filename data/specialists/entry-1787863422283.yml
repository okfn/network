reason: "I lead projects in technology, digital innovation, and the social adoption of knowledge focused on building accessible, people-centered solutions with social impact.\r\nWith over 10 years of experience in technology leadership, open-source ecosystems, computational linguistics, and digital transformation initiatives, I have worked with international organizations, nonprofits, academic institutions, and global technology communities to design and implement projects at the intersection of AI, collaboration, and social impact.\r\n\r\nMy expertise includes:\r\n• Product and technology strategy\r\n • Natural Language Processing (NLP)\r\n • Digital innovation\r\n • Stakeholder management\r\n • Leadership of multidisciplinary teams\r\n • Open technologies\r\n • Inclusive and multilingual digital ecosystems\r\n\r\nI currently serve as Executive Director of Wikimedia Colombia, where I lead strategic and operational initiatives related to technology, partnerships, community development, and digital knowledge infrastructure.\r\n\r\nI am particularly interested in:\r\n→ AI governance and responsible AI\r\n → NLP and multilingual technologies\r\n → Product strategy and innovation\r\n → Open-source ecosystems\r\n → Digital transformation\r\n → Technology for social impact"
