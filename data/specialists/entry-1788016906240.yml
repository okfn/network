reason: "Petar Gligorovski is a Digital Experience, Open Technology and Digital Transformation Specialist from North Macedonia with more than 25 years of professional experience across web technologies, UI/UX, design systems, digital platforms and digital communication.\r\n\r\nHe has previously contributed to UI/UX Design System work for CKAN, giving him direct experience with one of the most established open-source platforms in the global open-data ecosystem.\r\n\r\nHis expertise sits at the intersection of Open Data, Open Source, Open Tech, Civic Tech and Digital Public Infrastructure, with additional experience in UX and Design Systems, web development, data accessibility, information discoverability, SEO/AEO/GEO, digital transformation and emerging AI technologies.\r\n\r\nPetar is particularly interested in how better design, technology and AI can make public information and open data easier to discover, understand and use by citizens, organisations, researchers and institutions.\r\n\r\nThrough his professional work and his role as Founder & CEO of Bendisa – Creative Business Solutions, he has also built strong connections with businesses, NGOs, universities and regional organisations.\r\n\r\nHe would like to use this experience to help strengthen the Open Knowledge ecosystem in North Macedonia and the wider Balkan region, encourage collaboration between technology professionals, universities and civil society, and contribute to open-source and open-data initiatives with practical design, technology and communication expertise.\r\n\r\nPetar can bring to the OKFN Network a distinctive combination of senior digital experience, human-centred design, open technology, digital transformation and regional community-building, while also developing his work further around Open AI, responsible use of public data and digital technologies for the public good."
