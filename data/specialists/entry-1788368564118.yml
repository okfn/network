reason: >-
  I have spent close to a decade working at the intersection of technology
  policy, data governance, and digital rights, with a particular focus on the
  Global South, where open data and open knowledge are central to how digital
  public infrastructure is built and governed. My work across the Internet
  Society, CIVICUS, and the Global Encryption Coalition consistently advances
  open, rights-respecting, and publicly accountable approaches to digital
  governance, which align closely with Open Knowledge Foundation’s mission of a
  fair, sustainable, and open future. Staying part of the network would let me
  keep contributing to, and learning from, a community I consider central to
  this work.
