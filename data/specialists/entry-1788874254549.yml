reason: "Julio Herrera Toledo is the Executive Director and co-founder of Red Ciudadana, a Guatemalan civil society organization working to strengthen democracy, transparency and public sector innovation through open data, civic technology and digital transformation.\r\nFor more than 12 years, Julio has designed and implemented initiatives across Latin America and the Caribbean focused on open government, open data, digital governance, public sector modernization, open contracting, anti-corruption and citizen participation. His work bridges policy, technology and capacity building, helping public institutions and civil society organizations turn public data into practical tools for transparency, accountability and better public services.\r\nHe has collaborated with governments, international organizations and civil society networks on open data strategies, digital government initiatives, public procurement transparency, interoperability, civic technology platforms and institutional capacity building.\r\nHis combination of hands-on implementation experience, policy expertise and regional knowledge would make him a valuable contributor to the Open Knowledge Network, particularly for practitioners and organizations working in Guatemala, Central America and Latin America."
