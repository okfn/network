reason: "Ronny Ezin is a Digital Project Manager and digital media professional based in Burkina Faso. He is a co-founder of Wikimedia Burkina Faso and an active Wikimedia contributor and trainer, committed to promoting free knowledge, digital inclusion, and the visibility of African culture and heritage.\r\n\r\nThrough Wikimedia community initiatives, he supports capacity building, organizes training workshops, and encourages local communities to contribute to Wikipedia and other Wikimedia projects. He also works as a digital marketing trainer and consultant, combining his expertise in digital strategy, content development, and community engagement with his commitment to open knowledge.\r\n\r\nHis areas of interest include open knowledge, digital literacy, Wikimedia projects, digital media, photography, and the preservation and dissemination of African knowledge and cultural heritage."
