reason: >-
  Byambatsetseg (Tseku) Lkhagvasuren has led open data initiatives in Mongolia
  since 2018, when she co-founded Public Lab Mongolia, an NGO that tackles
  environmental public health issues through participatory mapping,
  community-led design, and data analysis. Since 2019, she has organized Open
  Data Day events in Mongolia with a focus on spatial data. Through a series of
  mapathons, she has trained hundreds of young Mongolians to use OpenStreetMap,
  producing publicly accessible spatial data on critical social infrastructure
  in both urban and rural areas. She is currently building a portal to collect
  and manage open data from community-driven environmental observations.
