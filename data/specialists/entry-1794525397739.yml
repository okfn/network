reason: >-
  Alyssa Arbuckle is the Strategic Research and Partnerships Advisor for the
  Canadian Research Knowledge Network, cross-appointed as a Special Advisor with
  the Érudit Consortium. In these roles she collaborates with and advocates for
  nation-wide open digital research infrastructure. Alyssa holds an
  Interdisciplinary PhD from the University of Victoria focusing on open social
  scholarship and its implementation. She also serves as Co-Editor of the
  diamond open access Journal of Electronic Publishing, with Janneke Adema.
  Throughout her career Alyssa has researched, taught about, and pushed for
  opening access to academic work, particularly in the humanities.
